
name: ExA-Client Android

on:
  workflow_dispatch:

  push:
    paths:
      - 'lib/**.[ch]'
      - 'lib/**.cpp'
      - 'src/**.[ch]'
      - 'src/**.cpp'
      - 'irr/**.[ch]'
      - 'irr/**.cpp'
      - '**/CMakeLists.txt'
      - 'cmake/Modules/**'
      - 'po/**.po'
      - 'android/**'
      - '.github/workflows/android.yml'

  pull_request:
    paths:
      - 'lib/**.[ch]'
      - 'lib/**.cpp'
      - 'src/**.[ch]'
      - 'src/**.cpp'
      - 'irr/**.[ch]'
      - 'irr/**.cpp'
      - '**/CMakeLists.txt'
      - 'cmake/Modules/**'
      - 'po/**.po'
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gettext

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build release AAB
        working-directory: android
        run: ./gradlew bundleRelease --stacktrace

      - name: Build release APKs
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Android App Bundle
        uses: actions/upload-artifact@v7
        with:
          name: ExA-Client-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload ARMv7 APK
        uses: actions/upload-artifact@v7
        with:
          name: ExA-Client-armeabi-v7a
          path: android/app/build/outputs/apk/release/*armeabi-v7a*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v7
        with:
          name: ExA-Client-arm64-v8a
          path: android/app/build/outputs/apk/release/*arm64-v8a*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload x86 APK
        uses: actions/upload-artifact@v7
        with:
          name: ExA-Client-x86
          path: android/app/build/outputs/apk/release/*x86-release*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v7
        with:
          name: ExA-Client-x86_64
          path: android/app/build/outputs/apk/release/*x86_64*.apk
          if-no-files-found: error
          retention-days: 30
          
