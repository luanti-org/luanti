name: wasm

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - '.github/workflows/wasm.yml'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'builtin/**'
      - 'client/**'
      - 'clientmods/**'
      - 'cmake/**'
      - 'fonts/**'
      - 'games/devtest/**'
      - 'games/flower_island/**'
      - 'games/log_ride/**'
      - 'games/luanti_web/**'
      - 'games/rollercoaster/**'
      - 'games/spire_tunnel/**'
      - 'irr/**'
      - 'lib/**'
      - 'src/**'
      - 'textures/**'
      - 'util/wasm/**'
  pull_request:
    paths:
      - '.github/workflows/wasm.yml'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'builtin/**'
      - 'client/**'
      - 'clientmods/**'
      - 'cmake/**'
      - 'fonts/**'
      - 'games/devtest/**'
      - 'games/flower_island/**'
      - 'games/log_ride/**'
      - 'games/luanti_web/**'
      - 'games/rollercoaster/**'
      - 'games/spire_tunnel/**'
      - 'irr/**'
      - 'lib/**'
      - 'src/**'
      - 'textures/**'
      - 'util/wasm/**'

permissions:
  contents: read

concurrency:
  group: wasm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  EMSDK_VERSION: '6.0.3'
  EMSDK_COMMIT: '1b8b2456bf3f54fd6e47d55a82dde7752978a40f'
  EMSDK_DIR: ${{ github.workspace }}/.cache/emsdk-sdk-6.0.3
  EM_CACHE: ${{ github.workspace }}/.cache/emscripten-6.0.3
  PLAYWRIGHT_VERSION: '1.59.0'
  BROTLI_VERSION: '1.1.0'

jobs:
  release:
    name: Release build and browser smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Check out Luanti
        uses: actions/checkout@v7

      - name: Cache Emscripten SDK and ports
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.EMSDK_DIR }}
            ${{ env.EM_CACHE }}
          key: wasm-${{ runner.os }}-${{ env.EMSDK_VERSION }}-${{ env.EMSDK_COMMIT }}

      - name: Install pinned Emscripten SDK
        shell: bash
        run: |
          if [[ ! -x "$EMSDK_DIR/emsdk" ]]; then
            git clone https://github.com/emscripten-core/emsdk.git "$EMSDK_DIR"
          fi
          git -C "$EMSDK_DIR" fetch --depth=1 origin "$EMSDK_COMMIT"
          git -C "$EMSDK_DIR" checkout --detach "$EMSDK_COMMIT"
          "$EMSDK_DIR/emsdk" install "$EMSDK_VERSION"
          "$EMSDK_DIR/emsdk" activate "$EMSDK_VERSION"
          source "$EMSDK_DIR/emsdk_env.sh"
          emcc --version

      # brotli is only used by util/wasm/size_report.py for the Brotli column
      # of the size log; without it the log says so and carries on.
      - name: Install browser smoke dependency
        run: python3 -m pip install --user "playwright==$PLAYWRIGHT_VERSION" "brotli==$BROTLI_VERSION"

      - name: Test deployment tools
        run: python3 util/wasm/test_demo_tools.py

      - name: Test the world library and archive validation
        run: node --test util/wasm/test_worlds.mjs

      - name: Test the startup checks (SIMD, shared-memory ceiling)
        run: node --test util/wasm/test_startup.mjs

      - name: Build libzip for Emscripten
        shell: bash
        run: |
          source "$EMSDK_DIR/emsdk_env.sh"
          if [[ ! -f "$(em-config CACHE)/sysroot/lib/libzip.a" ]]; then
            util/wasm/build_libzip.sh
          fi

      - name: Configure Release build
        shell: bash
        run: |
          source "$EMSDK_DIR/emsdk_env.sh"
          cmake --preset Emscripten

      - name: Build WebAssembly client
        shell: bash
        run: |
          source "$EMSDK_DIR/emsdk_env.sh"
          cmake --build build-wasm --parallel 2

      - name: Service worker regression tests in Chrome
        run: python3 util/wasm/test_service_worker_browser.py --browser "$(command -v google-chrome)"

      - name: Smoke generated client in Chrome
        run: python3 util/wasm/test_client_browser.py --browser "$(command -v google-chrome)"

      - name: Streamed asset packages and offline start in Chrome
        run: python3 util/wasm/test_packages_browser.py --browser "$(command -v google-chrome)"

      # A browser that refuses the 2 GiB shared-memory ceiling must still
      # reach the launcher (and a world) on the same luanti.wasm, and one that
      # grants nothing must say why. wasm_porting.md, "Heap ceiling probe".
      - name: Shared-memory ceiling fallback in Chrome
        run: python3 util/wasm/test_memory_probe_browser.py --browser "$(command -v google-chrome)"

      - name: World library (create, export, delete, import, share link) in Chrome
        run: python3 util/wasm/test_worlds_browser.py --browser "$(command -v google-chrome)"

      # Firefox covers the library flow without entering a world (headless
      # Firefox on the runner has no WebGL). Not a gate until it has run
      # green here.
      - name: World library in Firefox (non-gating)
        continue-on-error: true
        run: |
          python3 -m playwright install firefox
          python3 util/wasm/test_worlds_browser.py --engine firefox --no-play

      - name: Run the first playable gate in Chrome
        run: |
          python3 util/wasm/test_first_playable.py \
            --browser "$(command -v google-chrome)" \
            --screenshot-dir wasm-gate-screenshots

      - name: Upload first playable gate screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: luanti-wasm-gate-${{ github.sha }}
          path: wasm-gate-screenshots/
          if-no-files-found: ignore
          retention-days: 14

      # Context creation, loss, the WebGL1 fallback, resize and pointer lock
      # in both render modes (wasm_porting.md, "Render thread"). Not a gate
      # until it has run green here: it was developed against Emscripten
      # 3.1.61.
      - name: WebGL context in both render modes (non-gating)
        continue-on-error: true
        run: |
          python3 util/wasm/test_webgl_context.py --render proxy
          python3 util/wasm/test_webgl_context.py --render offscreen

      # Not a gate: SwiftShader numbers only catch large regressions. The
      # report is kept so a commit can be compared with its parent. Compare
      # the "server" entries before the frame times: a starved server leaves
      # the camera parked (doc/compiling/wasm.md, "Frame-time benchmark").
      - name: Benchmark frame time (non-gating)
        continue-on-error: true
        run: |
          python3 util/wasm/bench_frame_time.py \
            --browser "$(command -v google-chrome)" \
            --label "ci-swiftshader" \
            --output wasm-bench/frame-time.json \
            --screenshot wasm-bench/path-end.png
          python3 util/wasm/bench_frame_time.py \
            --browser "$(command -v google-chrome)" \
            --query "&render=offscreen" \
            --label "ci-swiftshader-offscreen" \
            --output wasm-bench/frame-time-offscreen.json \
            --screenshot wasm-bench/path-end-offscreen.png

      - name: Upload frame-time report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: luanti-wasm-bench-${{ github.sha }}
          path: wasm-bench/
          if-no-files-found: ignore
          retention-days: 30

      # Prints raw / gzip / Brotli bytes for luanti.wasm, luanti.js and the core
      # package, plus a wasm-opt re-run on a copy of luanti.wasm (the release is
      # not changed), into this log and wasm-size/. The failing budget check is
      # a separate gate; this produces the bytes it compares.
      - name: Package versioned demo
        shell: bash
        run: |
          mkdir -p wasm-size
          python3 util/wasm/package_demo.py --version "$GITHUB_SHA" --output wasm-demo \
            --size-report wasm-size/size-report.json --wasm-opt-trial \
            | tee wasm-size/package-demo.log
          {
            echo '### Download sizes'
            echo '```'
            python3 util/wasm/size_report.py --from-json wasm-size/size-report.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload deployable demo
        uses: actions/upload-artifact@v7
        with:
          name: luanti-wasm-${{ github.sha }}
          path: wasm-demo/
          if-no-files-found: error
          retention-days: 14

      - name: Upload size log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: luanti-wasm-size-${{ github.sha }}
          path: wasm-size/
          if-no-files-found: ignore
          retention-days: 30

      # mimalloc trial (wasm_porting.md, "Allocator trial"). -sMALLOC is a link
      # option, so this relinks the objects built above instead of compiling
      # again. It is a separate artifact and never the deployed build. The
      # default build is measured first, on this runner, so the comparison is
      # like for like. None of it gates the job.
      - name: Startup time and heap, default allocator (non-gating)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          python3 util/wasm/bench_startup.py --browser "$(command -v google-chrome)" \
            --label default --runs 3 --output wasm-size/startup-default.json

      - name: Relink with mimalloc (non-gating)
        id: mimalloc
        if: github.event_name != 'pull_request'
        continue-on-error: true
        shell: bash
        run: |
          source "$EMSDK_DIR/emsdk_env.sh"
          cmake -S . -B build-wasm -DWASM_MALLOC=mimalloc
          cmake --build build-wasm --parallel 2
          python3 util/wasm/package_demo.py --version "$GITHUB_SHA-mimalloc" \
            --output wasm-demo-mimalloc --size-report wasm-size/size-report-mimalloc.json \
            | tee wasm-size/package-demo-mimalloc.log

      - name: Startup time and heap, mimalloc (non-gating)
        if: steps.mimalloc.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          python3 util/wasm/bench_startup.py --browser "$(command -v google-chrome)" \
            --label mimalloc --runs 3 --output wasm-size/startup-mimalloc.json
          {
            echo '### mimalloc trial'
            echo '```'
            python3 util/wasm/bench_startup.py --compare \
              wasm-size/startup-default.json wasm-size/startup-mimalloc.json
            echo '```'
          } | tee wasm-size/mimalloc-verdict.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload mimalloc trial build and numbers
        if: steps.mimalloc.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: luanti-wasm-mimalloc-${{ github.sha }}
          path: |
            wasm-demo-mimalloc/
            wasm-size/*mimalloc*
            wasm-size/startup-default.json
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    name: Deploy default branch to Cloudflare Pages
    needs: release
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') &&
      vars.WASM_DEMO_DEPLOY_ENABLED == 'true' &&
      vars.CLOUDFLARE_PAGES_PROJECT != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Download deployable demo
        uses: actions/download-artifact@v8
        with:
          name: luanti-wasm-${{ github.sha }}
          path: wasm-demo

      - name: Deploy current default-branch build to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy wasm-demo
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }}
            --branch=${{ github.ref_name }}
            --commit-hash=${{ github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
